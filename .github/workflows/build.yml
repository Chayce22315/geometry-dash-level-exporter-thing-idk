name: build-test-and-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install .net 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: restore
        run: dotnet restore .\LevelVault.sln
      - name: build and run tests
        run: dotnet test .\LevelVault.sln --configuration Release --no-restore
      - name: publish self-contained windows app
        if: github.event_name != 'pull_request'
        run: dotnet publish .\src\LevelVault\LevelVault.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\LevelVault-win-x64
      - name: upload windows release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LevelVault-win-x64
          path: .\artifacts\LevelVault-win-x64\
          if-no-files-found: error
          retention-days: 14
