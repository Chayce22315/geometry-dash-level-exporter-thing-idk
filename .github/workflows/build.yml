name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install .net 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: restore
        run: dotnet restore .\LevelVault.sln
      - name: build and run tests
        run: dotnet test .\LevelVault.sln --configuration Release --no-restore
